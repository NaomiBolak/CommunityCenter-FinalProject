version: '3.9'

services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: community_db
    environment:
      SA_PASSWORD: "CommunityCenter123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CommunityCenter123!", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Server/CommunityCenter.API
      dockerfile: Dockerfile
    container_name: community_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=CommunityCenterDB;User Id=sa;Password=CommunityCenter123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "THIS_IS_MY_SUPER_SECRET_KEY_12345"
      Jwt__Issuer: "CommunityCenterAPI"
      Jwt__Audience: "CommunityCenterClient"
      Jwt__ExpireMinutes: "60"
    ports:
      - "5051:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: community_client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
